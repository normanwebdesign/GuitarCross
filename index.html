      '<label class="fld"><span>ARTIST / SOURCE</span><input type="text" id="edArtist" value="'+esc(s.artist)+'" placeholder="Optional"></label>'+
      '<div class="row" style="margin-bottom:12px">'+
        '<button class="btn sm grow" id="edKey">Key: '+esc(s.key||'not set')+'</button>'+
        '<button class="btn sm grow" id="edCapo">Capo: '+(s.capo||'none')+'</button>'+

    $('#edTitle',sheet).oninput=e=>{s.title=e.target.value;};
    $('#edArtist',sheet).oninput=e=>{s.artist=e.target.value;};
    $('#edKey',sheet).onclick=()=>openKeyPicker(s.key,k=>{s.key=k;top();});
    $('#edCapo',sheet).onclick=()=>openCapoSheet(s,()=>top());
  }
  function pane_text(){
    const isTab=s.type==='tab';
    return (s.type==='photo'
      ? '<div class="card"><h3>Photos</h3><div id="edPhotos" class="row wrap"></div>'+
        '<button class="btn block" id="edAddPhoto" style="margin-top:10px">+ Add photo</button></div>'+
        '<label class="fld"><span>NOTES (OPTIONAL)</span><textarea id="edText" placeholder="Capo, key, reminders...">'+esc(s.text)+'</textarea></label>'
      : '<label class="fld"><span>'+(isTab?'TABLATURE':'LYRICS')+'</span><textarea id="edText" class="mono" spellcheck="false" placeholder="'+(isTab?'e|---0---2---3---|':'Paste or type your lyrics here.\nChord lines above the words are detected automatically.')+'">'+esc(s.text)+'</textarea></label>'+
        '<div class="row wrap" style="gap:8px;margin-bottom:12px">'+
          (isTab?'<button class="btn sm" id="edTabTpl">Insert blank tab</button>'
                :'<button class="btn sm" id="edDetect">Detect chords in text</button><button class="btn sm" id="edStrip">Clear placed chords</button>')+
        '</div>'+
        (isTab?'':'<div class="muted">Works with sheets copied from the web: chords on their own line above the lyrics, or inline like <span class="mono">[G]amazing [C]grace</span>. Then switch to <b>Place chords</b> to fine tune.</div>')
    );
  }
  function pane_place(){
    const pref=songPref(s);
    const lines=s.text.split(/\r?\n/);
    let html='<div class="muted" style="margin-bottom:10px">Tap any letter to drop a chord above it. Tap a chord to change, nudge or delete it.</div>'+
      '<div class="songbody" style="font-size:'+Math.max(15,DB.settings.songFont)+'px">';
    lines.forEach((line,i)=>{
      const anchors=s.chords.filter(a=>a.l===i);
      html+='<div class="chordline">'+(anchors.length?chordRowHTML(anchors,pref,0,i,true):'&nbsp;')+'</div>';
      let row='';
      for(let c=0;c<line.length;c++){
        row+='<span class="placechar" data-pl="'+i+'" data-pc="'+c+'">'+(line[c]===' '?'&nbsp;':esc(line[c]))+'</span>';
      }
      row+='<span class="placechar phslot" data-pl="'+i+'" data-pc="'+line.length+'"> +</span>';
      html+='<div class="'+(SECT_RE.test(line)?'sect':'')+'">'+row+'</div>';
    });
    return html+'</div>';
  }
  async function drawPhotos(){
    const box=$('#edPhotos',sheet); if(!box) return;
    box.innerHTML='';
    for(const k of s.images){
      const d=await idb.safeGet(k); if(!d) continue;
      const w=el('div','');
      w.style.cssText='position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;background:#000';
      w.innerHTML='<img src="'+d+'" style="width:100%;height:100%;object-fit:cover">'+
        '<button data-rm="'+k+'" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border-radius:50%;width:24px;height:24px;color:#fff">&#10005;</button>';
      box.appendChild(w);
    }
    if(!s.images.length) box.innerHTML='<div class="muted">No photos yet.</div>';
  }
  function draw(){
    top();
    $('#edPane',sheet).innerHTML = pane==='place'?pane_place():pane_text();
    const ta=$('#edText',sheet);
    if(ta){
      ta.oninput=e=>{s.text=e.target.value;};
      if(s.type==='tab'){ ta.style.whiteSpace='pre'; ta.style.overflowX='auto'; ta.style.minHeight='260px'; }
    }
    if($('#edAddPhoto',sheet)) $('#edAddPhoto',sheet).onclick=()=>pickImages(s,()=>drawPhotos());
    if($('#edDetect',sheet)) $('#edDetect',sheet).onclick=()=>{
      const hasBrackets=/\[[^\]]+\]/.test(s.text);
      const r=hasBrackets?parseChordPro(s.text):importPlainSheet(s.text);
      if(!r.chords.length){ toast('No chords found in the text'); return; }
      s.text=r.text; s.chords=r.chords;
      if(!s.key) s.key=guessKey(s);
      pane='place'; draw(); toast(r.chords.length+' chords placed');
    };
    if($('#edStrip',sheet)) $('#edStrip',sheet).onclick=()=>{
      if(!s.chords.length){ toast('Nothing to clear'); return; }
      confirmSheet('Clear chords?','This removes all '+s.chords.length+' placed chords. The lyrics stay.','Clear',()=>{s.chords=[];draw();});
    };
    if($('#edTabTpl',sheet)) $('#edTabTpl',sheet).onclick=()=>{
      const t='e|--------------------------------|\nB|--------------------------------|\nG|--------------------------------|\nD|--------------------------------|\nA|--------------------------------|\nE|--------------------------------|\n';
      s.text=(s.text?s.text+'\n':'')+t; draw();
    };
    drawPhotos();
  }
  $('#edTop',sheet).parentNode.addEventListener('click',e=>{
    const p=e.target.closest('[data-p]');
    if(p){ pane=p.dataset.p; draw(); return; }
    const rm=e.target.closest('[data-rm]');
    if(rm){
      const k=rm.dataset.rm;
      s.images=s.images.filter(x=>x!==k);
      s.pins=(s.pins||[]).filter(x=>x.img!==k);
      idb.del(k); drawPhotos(); return;
    }
    const ch=e.target.closest('.ch[data-edit]');
    if(ch){ editAnchor(+ch.dataset.l,+ch.dataset.c); return; }
    const pc=e.target.closest('.placechar');
    if(pc){ placeAt(+pc.dataset.pl,+pc.dataset.pc); return; }
  });
  function keyCtx(){
    const kc=s.key?parseChord(s.key):null;
    return kc?{keyPc:kc.pc,keyMinor:isMinorQual(kc.qual),keyName:s.key}:{};
  }
  function placeAt(l,c){
    const existing=s.chords.filter(a=>a.l===l&&a.c===c)[0];
    if(existing){ editAnchor(l,c); return; }
    openChordPicker(n=>{ closeSheet(); s.chords.push({l:l,c:c,n:n}); if(!s.key)s.key=guessKey(s); draw(); },keyCtx());
  }
  function editAnchor(l,c){
    const a=s.chords.filter(x=>x.l===l&&x.c===c)[0]; if(!a) return;
    openChordSheet(a.n,{
      footer:'<div class="row" style="margin-top:14px;gap:8px"><span class="muted grow">Nudge position</span>'+
             '<button class="btn sm" id="anL">&#8592;</button><button class="btn sm" id="anR">&#8594;</button></div>',
      onChange:n=>{ a.n=n; draw(); },
      onRemove:()=>{ s.chords=s.chords.filter(x=>x!==a); draw(); },
      onFooter:sh=>{
        $('#anL',sh).onclick=()=>{ if(a.c>0){a.c--;draw();} };
        $('#anR',sh).onclick=()=>{ a.c++; draw(); };
      }
    });
  }
  $('#edSave',sheet).onclick=()=>{
    const lines=s.text.split(/\r?\n/);
    s.chords=s.chords.filter(a=>a.l>=0&&a.l<lines.length).map(a=>({l:a.l,c:Math.max(0,a.c),n:a.n}));
    s.title=(s.title||'').trim()||'Untitled';
    if(!s.key&&s.chords.length) s.key=guessKey(s);
    const target=getSong(s.id);
    if(target) Object.assign(target,s); else DB.songs.unshift(s);
    saveSong(getSong(s.id));
    closeSheet(); renderSongList(); toast('Saved');
  };
  draw();
}

function openModulateSheet(s,cb){
  const pref=songPref(s);
  const uniq=[];
  s.chords.forEach(a=>{ if(uniq.indexOf(a.n)<0) uniq.push(a.n); });
  (s.pins||[]).forEach(p=>{ if(uniq.indexOf(p.n)<0) uniq.push(p.n); });
  const cur=s.transpose||0;
  let steps=0;
  function table(st){
    if(!uniq.length) return '<div class="muted">This song has no placed chords yet.</div>';
    return '<div class="mono" style="font-size:14px;line-height:1.9">'+uniq.slice(0,18).map(n=>{
      const from=transposeSym(n,cur,pref), to=transposeSym(n,cur+st,pref);
      return '<div class="row"><span style="width:76px;color:var(--dim)">'+esc(from)+'</span><span style="color:var(--dim2)">&#8594;</span>'+
             '<span style="width:76px;margin-left:10px;color:var(--accent);font-weight:700">'+esc(to)+'</span></div>';
    }).join('')+(uniq.length>18?'<div class="muted">+'+(uniq.length-18)+' more</div>':'')+'</div>';
  }
  const body=
    '<div class="row spread"><div class="muted">Current key</div><b id="mdFrom"></b></div>'+
    '<div class="row spread" style="margin:6px 0 12px"><div class="muted">New key</div><b id="mdTo" style="color:var(--accent)"></b></div>'+
    '<div class="row" style="gap:8px;margin-bottom:6px">'+
      '<button class="btn grow" id="mdDown">&#9837; Down</button>'+
      '<span class="chip" id="mdSteps" style="min-width:92px;justify-content:center">0 semitones</span>'+
      '<button class="btn grow" id="mdUp">Up &#9839;</button>'+
    '</div>'+
    '<div class="muted" style="text-align:center;margin-bottom:12px" id="mdCapo"></div>'+
    '<div id="mdTable"></div>'+
    '<div class="row" style="margin-top:16px;gap:8px">'+
      '<button class="btn grow" id="mdReset">Back to original</button>'+
      '<button class="btn pri grow" id="mdApply">Apply</button>'+
    '</div>';
  openSheet({title:'Modulate',body:body,onMount:sh=>{
    function upd(){
      const base=s.key||guessKey(s)||'C';
      $('#mdFrom',sh).textContent=transposeSym(base,cur,pref);
      $('#mdTo',sh).textContent=transposeSym(base,cur+steps,pref);
      $('#mdSteps',sh).textContent=(steps>0?'+':'')+steps+' semitone'+(Math.abs(steps)===1?'':'s');
      $('#mdCapo',sh).innerHTML = steps>0&&steps<=7
        ? 'Shortcut: keep the shapes you already know and put a capo on fret '+steps+'.'
        : (steps<0?'Going down - a capo cannot help here, so these are the new shapes to play.':'');
      $('#mdTable',sh).innerHTML=table(steps);
    }
    $('#mdUp',sh).onclick=()=>{steps=clamp(steps+1,-11,11);upd();};
    $('#mdDown',sh).onclick=()=>{steps=clamp(steps-1,-11,11);upd();};
    $('#mdReset',sh).onclick=()=>{ s.transpose=0; cb(); closeSheet(); toast('Original key'); };
    $('#mdApply',sh).onclick=()=>{ s.transpose=((cur+steps)%12+12)%12; if(s.transpose>6)s.transpose-=12; cb(); closeSheet(); toast('Modulated'); };
    upd();
  }});
}

function metroClick(when,accent){
  const ac=audio();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='square'; o.frequency.value=accent?1600:1050;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(accent?0.3:0.18,when+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.045);
  o.connect(g); g.connect(ac.destination);
  o.start(when); o.stop(when+0.06);
}
function metroStart(){
  const ac=audio();
  metro.on=true; metro.count=0; metro.next=ac.currentTime+0.08;
  metro.timer=setInterval(()=>{
    const ac2=audio();
    while(metro.next<ac2.currentTime+0.12){
      const beat=metro.count%toolState.beats;
      metroClick(metro.next,beat===0);
      const delay=Math.max(0,(metro.next-ac2.currentTime)*1000);
      setTimeout(()=>{
        const d=$('#mDots'); if(!d) return;
        Array.prototype.forEach.call(d.children,(c,i)=>{ c.style.background=(i===beat)?(beat===0?'#1ed98a':'#8ba0b8'):'#2e3c4d'; });
      },delay);
      metro.next+=60/toolState.bpm;
      metro.count++;
    }
  },25);
}
function metroStop(){
  metro.on=false; clearInterval(metro.timer);
  const d=$('#mDots'); if(d) Array.prototype.forEach.call(d.children,c=>c.style.background='#2e3c4d');
}

/* ---- backup ---- */
async function exportBackup(){
  toast('Building backup...');
  const imgs={};
  for(const s of DB.songs){
    s.images=Array.isArray(s.images)?s.images:[];
    s.pins=normPins(s.pins,s.images);
    for(const k of s.images){ const d=await idb.safeGet(k); if(d) imgs[k]=d; }
  }
  const payload={app:'guitar-cross',version:1,exported:new Date().toISOString(),songs:DB.songs,settings:DB.settings,images:imgs};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='guitar-cross-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Backup saved');
}
$('#jsonPick').addEventListener('change',function(){
  const f=this.files&&this.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const o=JSON.parse(fr.result);
      if(!o.songs) throw new Error('Not a Guitar Cross backup');
      let added=0;
      for(const s of o.songs){
        if(getSong(s.id)) s.id=uid();
        s.images=Array.isArray(s.images)?s.images:[];
        s.pins=normPins(s.pins,s.images);
        DB.songs.unshift(s); added++;
      }
      if(o.images) for(const k of Object.keys(o.images)) await idb.put(k,o.images[k]);
      if(o.settings) Object.assign(DB.settings,o.settings);
      dbSave(); renderSongList(); renderTools();
      toast('Imported '+added+' song'+(added===1?'':'s'));
    }catch(e){ toast('Could not read that file'); }
  };
  fr.readAsText(f);
  this.value='';
});

    '<li>Put <b>index.html</b> anywhere that serves it over <b>https</b> - GitHub Pages is free and takes about five minutes.</li>'+

    '<p class="muted">Your songs live in this browser profile. Adding to the Home Screen gives the app its own storage, so export a backup first if you already added songs in Safari.</p>'});
}
